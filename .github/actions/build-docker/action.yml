name: 'Build Docker Image'
description: 'Build and push Docker image with configurable platforms'

inputs:
  platforms:
    description: 'Comma-separated list of platforms to build (e.g., linux/amd64,linux/arm64)'
    required: false
    default: 'linux/amd64'
  push:
    description: 'Whether to push the image to registry'
    required: false
    default: 'true'
  cache:
    description: 'Whether to use cache'
    required: false
    default: 'true'
  gh_pat:
    description: 'GitHub Personal Access Token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.gh_pat }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/marcbey/kanban
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=pr
          type=sha,format=short

    - name: Parse versions from .tool-versions
      id: parse-asdf
      shell: bash
      run: ./scripts/versions.sh

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        cache-from: ${{ inputs.cache == 'true' && format('type=registry,ref=ghcr.io/marcbey/kanban:cache') || '' }}
        cache-to: ${{ inputs.cache == 'true' && format('type=registry,ref=ghcr.io/marcbey/kanban:cache,mode=max') || '' }}
        tags: ${{ steps.meta.outputs.tags }}
        platforms: ${{ inputs.platforms }}
        labels: ${{ steps.meta.outputs.labels }}
        push: ${{ inputs.push }}
        build-args: |
          ELIXIR_VERSION=${{ env.ELIXIR_VERSION }}
          OTP_VERSION=${{ env.ERLANG_VERSION }}

    - name: Get unique image tag
      id: get-unique-docker-tag
      if: github.ref == 'refs/heads/main' && inputs.push == 'true'
      shell: bash
      run: |-
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" \
                    | grep 'sha' \
                    | tr '\n' ' ' \
                    | awk '{print $1}')
        echo "sha_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT 