services:
  db:
    image: postgres:15.2
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - ${POSTGRES_PORT:-5432}
    volumes:
      - db_data:/var/lib/postgresql/data
  web:
    depends_on:
      - db
    image: ${WEB_IMAGE:-ghcr.io/marcbey/kanban:latest}
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/postgres
      SECRET_KEY_BASE: +sIRu5nBx+g8Obw7F9FeJfNM9paJ6TfwmzgXKgfQHTuERpKNaatno6x0+YfGOWj4
    ports:
      - 4000:4000
    command: >
      bash -c "bin/migrate && bin/server"

volumes:
  db_data:
